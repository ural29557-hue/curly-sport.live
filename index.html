    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;

            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .match-btn {
            background-color: #333333;

            border: none;
            padding: 10px 15px;

            font-weight: bold;
            transition: background 0.2s;

        .match-btn:hover {
            background-color: #555555;

        .match-btn.active {
            background-color: #e50914;

            display: flex;
            gap: 15px;
            max-width: 1200px;
            margin: 20px auto 0 auto;

        .sponsor-item:hover {
            border-color: #e50914;
            color: #ffffff;
        }

        .sponsor-logo {
            max-height: 35px;
            max-width: 120px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>СПОРТ.LIVE</h1>
<div class="controls">
            <button class="match-btn" onclick="switchMatch(1)">МАТЧ 1</button>
            <button class="match-btn" onclick="switchMatch(2)">МАТЧ 2</button>
            <button class="match-btn" onclick="switchMatch(3)">МАТЧ 3</button>
            <button class="match-btn" onclick="switchMatch(4)">МАТЧ 4</button>
            <button class="match-btn" onclick="switchMatch(5)">МАТЧ 5</button>
            <button class="match-btn" onclick="switchMatch(6)">МАТЧ 6</button>
        </div>
    </div>

    <div class="main-container">
        <!-- Секция плеера -->
        <div class="player-section">
            <iframe id="player" src="" allowfullscreen></iframe>
        </div>

        <!-- Секция чата -->
        <div class="chat-section">
            <iframe id="chatIframe" src=""></iframe>
        </div>
    </div>

    <!-- Кнопки действий -->
    <div class="action-buttons">
        <a href="#" class="action-btn btn-donate">ПОДДЕРЖАТЬ ПРОЕКТ (ДОНАТ)</a>
        <a href="#" class="action-btn btn-tg">ПОДПИСАТЬСЯ НА ТГ-КАНАЛ</a>
    </div>

    <!-- БЛОК СПОНСОРОВ -->
    <div class="sponsors-section">
        <div class="sponsors-title">Спонсоры и партнеры</div>
        <div class="sponsors-grid">
            <a href="https://example.com" target="_blank" class="sponsor-item">Спонсор 1</a>
            <a href="https://example.com" target="_blank" class="sponsor-item">Спонсор 2</a>
            <a href="https://example.com" target="_blank" class="sponsor-item">Спонсор 3</a>
        </div>
    </div>

    <script>
        // 1. ССЫЛКИ НА ТРАНСЛЯЦИИ (вместо существующих примеров)
        const streams = {
            1: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",
            2: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",
            3: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",
            4: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",
            5: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",
            6: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg"
        };

        // 2. СЮДА ВСТАВЬТЕ ССЫЛКИ НА СВОИ ЧАТЫ
        // Если чатов нет, можно вставить один общий чат (например, виджет чата DonationAlerts) во все поля
        const chats = {
            1: "" + window.location.hostname,
            2: "" + window.location.hostname,
            3: "",
            4: "" + window.location.hostname,
            5: "" + window.location.hostname,
            6: "" + window.location.hostname
        };

        // Логика переключения матчей и чатов
        function switchMatch(matchNum) {
            // Меняем видео в плеере
            document.getElementById('player').src = streams[matchNum];
            // Меняем чат в окне чата
            document.getElementById('chatIframe').src = chats[matchNum];

            // Делаем активной только нажатую кнопку
            const buttons = document.querySelectorAll('.match-btn');
            buttons.forEach((btn, index) => {
                if (index === (matchNum - 1)) {
                    btn.classList.add('active'); // Кнопка горит красным
                } else {
                    btn.classList.remove('active'); // Остальные кнопки серые
                }
            });
        }

        // При первой загрузке страницы автоматически включится МАТЧ 1
        window.onload = function() {
            switchMatch(1);
        };
    </script>
</body>
