<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Прямая трансляция матчей</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .player-section {
            flex: 2;
            min-width: 300px;
        }

        .chat-section {
            flex: 1;
            min-width: 280px;
            height: 450px;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
            border-radius: 8px;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .match-btn {
            background-color: #333333;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .match-btn:hover {
            background-color: #555555;
        }

        .match-btn.active {
            background-color: #e50914; /* Красная активная кнопка */
        }

        /* --- СТИЛИ ДЛЯ БЛОКА СПОНСОРОВ --- */
        .sponsors-section {
            max-width: 1200px;
            margin: 40px auto 20px auto;
            padding-top: 20px;
            border-top: 1px solid #333333;
            text-align: center;
        }

        .sponsors-title {
            font-size: 14px;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .sponsors-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;

        .sponsor-item {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
            background-color: #1e1e1e;
            border-radius: 8px;
            text-decoration: none;
            color: #aaaaaa;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid #2a2a2a;
        }

        .sponsor-item:hover {
            transform: translateY(-3px);
            border-color: #e50914;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.2);
        }

        .sponsor-logo {
            max-height: 40px;
            max-width: 120px;
            object-fit: contain;
            filter: grayscale(80%); /* Градиент в ЧБ, при наведении станет цветным */
            transition: filter 0.3s ease;
        }

        .sponsor-item:hover .sponsor-logo {
            filter: grayscale(0%);
        }
    </style>
</head>
<body>

    <div class="main-container">

        <div class="player-section">
            <iframe id="player" src="" allowfullscreen></iframe>
            
            <!-- Кнопки переключения матчей -->
            <div class="controls">
                <button class="match-btn" onclick="switchMatch(1)">Матч 1</button>

    <script>
        // 1. ССЫЛКИ НА ТРАНСЛЯЦИИ
        const streams = {
            1: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",
            2: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",
            3: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",

            5: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg",
            6: "https://mgeu-kirov.ru/upload/iblock/f76/gsdpjenau6dr0kswwr84f4gu7kcez0zf/Screenshot_44.jpg"
        };

        // 2. ССЫЛКИ НА ЧАТЫ
        const chats = {
            1: "https://" + window.location.hostname,
            2: "https://" + window.location.hostname,
            3: "",
            4: "https://" + window.location.hostname,
            5: "https://" + window.location.hostname,
            6: "https://" + window.location.hostname
        };

        // Логика переключения матчей и чатов
        function switchMatch(matchNum) {
            // Меняем видео в плеере
            document.getElementById('player').src = streams[matchNum];
            // Меняем чат в окне чата
            document.getElementById('chatIframe').src = chats[matchNum];

            // Делаем активной только нажатую кнопку
            const buttons = document.querySelectorAll('.match-btn');
            buttons.forEach((btn, index) => {
                if (index === (matchNum - 1)) {
                    btn.classList.add('active'); // Кнопка горит красным
                } else {
                    btn.classList.remove('active'); // Остальные кнопки серые
                }
            });
        }

        // При первой загрузке страницы автоматически включится МАТЧ 1
        window.onload = function() {
            switchMatch(1);
        };
    </script>
